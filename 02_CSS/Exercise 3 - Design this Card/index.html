<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .box1 {

            border: 2px solid black;
            height: 80vh;
            width: 50vw;
            padding: 40px;
            /* background-color: rgba(179, 194, 199, 0.692); */
            background-color:lightgray;
            text-align: center;
           
        }

        .box2 {
            height: 80vh;

            border: 2px solid rgba(91, 92, 92, 0.692);
            background-color: white;
             border-radius: 20px;
        }

        .box3 {
            padding: 10px;
            border-radius: 20px;
        }

        img {
            height: 40vh;
            border-radius: 20px;
            position: sticky;
            border: 2px solid black;
        }

        .tag {
            position: relative;
            right: 55px;
            top: 10px;
            background-color: #eef3f6;
            color: #5a5a5a;
            border-radius: 15px;
            font-size: 14px;
            margin: 10px;
            padding: 8px;
            border: 1px solid rgb(151, 147, 147);
            ;
        }

        .heading {
            position: relative;
            top: 30px;
            right: 50px;
        }

        .content {
            position: relative;
            top: 50px;
            font-size: 20px;
            padding: 20px;
        }

        .read-more {
            position: relative;
            top: 55px;
            padding: 5px;
            background-color: #e6f0fd;
            color: #2f76e0;
            border-radius: 25px;
            border: 2px solid  #2f76e0 ;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- card.png is a file which contains a card Image. Write html and css code to design this card. Use #html -->

    <div class="box1">
        <div class='box2'>
            <div class='box3'>

                <img src="https://wallpapers.com/images/hd/krishna-ji-and-radha-in-gold-ensembles-t0n2wk5lwbxopy3e.jpg"
                    alt="Radhey krishn">
                <div>
                    <Span class="tag">Radhey</Span>
                    <Span class="tag">Krishna</Span>

                    <h2 class="heading">Radhey Radhey</h2>
                    <p class="content"> Hare krishna hare krishna krishna krishna hare hare ,hare rama hare rama rama
                        rama hare hare.... </p>
                    <a href="#" class="read-more">Read more </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
