<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ball Animation</title>
    <style>
        .container {
            height: 100vh;
            width: 100vw;
            background-color: cyan;

        }

        .circle {
            height: 120px;
            width: 120px;
            background-color: bisque;
            position: absolute;
            bottom: 0;
            border-radius: 60px;
          
            animation: animateX 3s linear infinite, animateY 1s ease-out infinite alternate;
        }

        @keyframes animateX {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }

            to {
                bottom: 100%;
            }
        }
    </style>
</head>
<div class="container">
    <div class="circle"></div>
</div>

<body>

</body>

</html>
