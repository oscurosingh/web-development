<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic Bouncing Ball</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    } 

    .container {
      height: 100vh;
      width: 100vw;
      background: #f1f1f1;
      position: relative;
    }

    .ball {
      width: 100px;
      height: 100px;
      background: red;
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      animation: realisticBounce 5s ease-in-out infinite;
    }

    @keyframes realisticBounce {
      0%   { transform: translateX(0px) translateY(0); }
      10%  { transform: translateX(60px) translateY(-600px); }
      20%  { transform: translateX(120px) translateY(0); }
      30%  { transform: translateX(180px) translateY(-300px); }
      40%  { transform: translateX(240px) translateY(0); }
      50%  { transform: translateX(300px) translateY(-150px); }
      60%  { transform: translateX(360px) translateY(0); }
      70%  { transform: translateX(420px) translateY(-75px); }
      80%  { transform: translateX(480px) translateY(0); }
      90%  { transform: translateX(540px) translateY(-37.5px); }
      100% { transform: translateX(600px) translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ball"></div>
  </div>
</body>
</html>
