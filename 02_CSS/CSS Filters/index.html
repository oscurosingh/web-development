<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
        }
        .img1{
            filter:brightness(0.5);
        }
        .img2{filter: contrast(200%);}
        .img3{filter: grayscale(50%);}
        .img4{filter: sepia(100%);}
        .img5{filter: opacity(25%);}
    </style>
</head>

<body>
    <div class="container">
        <div class="img1"><img src="https://www.astrosage.com/wallpapers/images/radha-wallpaper-2.jpg" alt=""></div>
        <div class="img2"><img src="https://cdn.pixabay.com/photo/2023/10/21/22/10/ai-generated-8332746_1280.png"
                alt=""></div>
        <div class="img3"><img src="https://wallpaperaccess.com/full/8727292.jpg" alt=""></div>
        <div class="img4"><img src="https://tse4.mm.bing.net/th/id/OIP.Ri0bE5j2lMrNZh9VhBnmSgHaFt?pid=Api&P=0&h=180"
                alt=""></div>
        <div class="img5"><img src="https://tse2.mm.bing.net/th/id/OIP.VFSJ8M6VlketRBr_VQ0IogHaH1?pid=Api&P=0&h=180"
                alt=""></div>
    </div>
</body>

</html>
