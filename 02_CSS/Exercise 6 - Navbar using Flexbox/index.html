<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 06</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #main-header {
            background-color: white;
            display: flex;

        }

        #logos {

            padding: 10px;




        }

        #logo1 {
            max-height: 40px;
            position: relative;


            width: auto;
            /* margin-bottom: 0; */
            /* vertical-align: middle; */

        }

        #logo2 {
            height: 10px;
            align-self: flex-end;
            position: relative;


            width: auto;
            /* margin-top: 0; */
            /* margin-left: 40px; */
            right: 40px;

            /* margin-bottom: 0; */
            /* vertical-align: middle; */
        }

        #main-menu {

            justify-content: space-between;
            align-self: center;
           
            margin-left: 30px;


        }
        li{
            margin-left: 20px;
        }

        .nav-links {
            display: flex;

            list-style: none;


            position: relative;
        }

        a[href] {
            color: black;
            text-decoration: none;
        }

        .Buy {

            border: 2px solid black;
            color: black;
            font-weight: bolder;
            text-align: center;
            align-content: center;
            height: 5vh;
            align-self: center;
            margin-left: 50px;
        }

        .search-icon {
            align-self: center;
            margin-left: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .language-selector {
            align-self: center;
            margin-left: 20px;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div id="main-header">
                <div id='logos'>
                    <img src="Background-2.png" width="1581" height="490" alt="UltraEdit" id="logo1"
                        data-height-percentage="58">

                    <img src="Layer-1-1.png" alt="image" id="logo2">
                    <!-- <span class="mobile_menu_bar mobile_menu_bar_toggle">
                    </span>
                    <span id="et_search_icon"></span> -->
                </div>
                <div id="main-menu">
                    <ul class="nav-links">

                        <li><a href="#">Products ▼</a></li>
                        <li><a href="#">Pricing ▼</a></li>
                        <li><a href="#">Resources ▼ </a></li>
                        <li><a href="#">Our Company ▼</a></li>
                    </ul>

                </div>
                <div class="Buy">
                    <span>BUY NOW</span>
                </div>
                <div class="language-selector">
                    <span> 🌐English</span>
                </div>
                <div class="search-icon">
                    <span>🔎</span>
                </div>
            </div>
        </nav>
    </header>
</body>

</html>
