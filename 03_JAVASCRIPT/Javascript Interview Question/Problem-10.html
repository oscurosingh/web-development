<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>// The Coffee Machine: In your coffee shop application, you need to simulate the process of brewing coffee asynchronously. Write an async function named brewCoffee that takes the type of coffee and returns a promise. The promise should resolve with a message indicating that the coffee is ready after a random delay.


        async function brewCoffee(type) {
            return new Promise((resolve) => {
                const delay = Math.floor(Math.random() * 2000) + 1000; // 1000–2999 ms (1–3s)
                setTimeout(() => {
                    resolve(`${type} Coffee is Ready!!`);
                }, delay);
            });
        }

        // Test the function
        brewCoffee("Espresso").then((message) => {
            console.log(message);
        });

        brewCoffee("Cappuccino").then((message) => {
            console.log(message);
        });
    </script>
</body>

</html>
