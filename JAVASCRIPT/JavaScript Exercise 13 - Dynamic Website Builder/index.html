<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', "Arial", sans-serif;
        }


        .card {
            display: flex;
            justify-content: left;
            align-items: flex-start;
            cursor: pointer;
            padding: 12px;
            transition: background-color 0.2s cubic-bezier(0, 1.37, 0.88, 0.58);
            width: 800px;
         
            gap: 12px;
        }

        .card:hover {
            background: rgb(229, 229, 229);
            border-radius: 5px;

        }


        .image img {
            display: block;
            width: 180px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        .image {
            position: relative;
            width: 180px;
            height: 100px;
            flex-shrink: 0;
      
        }

        .image .capsule {
            position: absolute;
            right: 5px;
            background: #242020;
            opacity: .69;
            color: white;
            bottom: 4px;
            border-radius: 3px;
            padding: 3px;
            font-size: 11px;
        }

        .text {
            margin: 0;
        }

        .text h3 {
            font-family: 'Roboto', "Arial", sans-serif;
            font-size: 14px;
            /* margin: 0 0 6px 0;// margin-bottom: 6px; */
            line-height: 1.3;
        }

        .text p {
            margin: 0;
            color: #606060;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEnCNACELwBSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLDf-xrqgUw55JSfKsoykKVhngkzRA"
                    alt="">
                <div class="capsule">
                    31:20
                </div>
            </div>
            <div class="text">
                <h3>Installing VS Code & How Websites Work | Sigma Web Development Course - Tutorial #1</h3>
                <p>CodeWithHarry . 7.4M views . 2 years ago</p>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
